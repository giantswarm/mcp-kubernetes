suite: OAuth loopback redirect URIs
templates:
  - templates/deployment.yaml
set:
  replicaCount: 1
  mcpKubernetes.oauth.enabled: true
  mcpKubernetes.oauth.baseURL: https://mcp.example.com
  mcpKubernetes.oauth.existingSecret: oauth-credentials
  mcpKubernetes.oauth.dex.issuerURL: https://dex.example.com
  mcpKubernetes.oauth.dex.clientID: mcp-kubernetes
tests:
  - it: ignores the deprecated loopback redirect opt-in
    set:
      mcpKubernetes.oauth.redirectURISecurity.allowLocalhostRedirectURIs: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-localhost-redirect-uris=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --disable-production-mode=true

  - it: refuses the removed HTTP redirect bypass
    set:
      mcpKubernetes.oauth.redirectURISecurity.disableProductionMode: true
    asserts:
      - failedTemplate:
          errorPattern: "disableProductionMode.*value must be false"
