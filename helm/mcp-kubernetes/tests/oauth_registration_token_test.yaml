# The registration access token reaches the server as --registration-token,
# expanded by the kubelet from the REGISTRATION_TOKEN env var the chart reads
# from the OAuth Secret, so the token never appears in the pod spec.
suite: OAuth registration token
templates:
  - templates/deployment.yaml
set:
  mcpKubernetes.oauth.enabled: true
  mcpKubernetes.oauth.baseURL: https://mcp.example.com
  mcpKubernetes.oauth.dex.issuerURL: https://dex.example.com
  mcpKubernetes.oauth.dex.clientID: mcp-kubernetes
  mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth
tests:
  - it: passes the token from the Secret, never its value
    set:
      mcpKubernetes.oauth.registrationAccessToken: reg-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --registration-token=$(REGISTRATION_TOKEN)
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --registration-token=reg-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: mcp-kubernetes-oauth
                key: registration-token

  - it: passes no token without one
    set:
      mcpKubernetes.oauth.trustedPublicRegistrationSchemes: [cursor]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --registration-token=$(REGISTRATION_TOKEN)
