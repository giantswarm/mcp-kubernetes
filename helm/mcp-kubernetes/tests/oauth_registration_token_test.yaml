suite: OAuth initial access token
templates:
  - templates/deployment.yaml
set:
  mcpKubernetes.oauth.enabled: true
  mcpKubernetes.oauth.baseURL: https://mcp.example.com
  mcpKubernetes.oauth.dex.issuerURL: https://dex.example.com
  mcpKubernetes.oauth.dex.clientID: mcp-kubernetes
  mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth
tests:
  - it: reads the initial access token through secretKeyRef
    set:
      mcpKubernetes.oauth.initialAccessToken: reg-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_INITIAL_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: mcp-kubernetes-oauth
                key: registration-token
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --registration-token=$(REGISTRATION_TOKEN)
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: maps the deprecated value to the canonical env var
    set:
      mcpKubernetes.oauth.registrationAccessToken: legacy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_INITIAL_ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: mcp-kubernetes-oauth
                key: registration-token

  - it: omits the token without one
    set:
      mcpKubernetes.oauth.trustedPublicRegistrationSchemes: [cursor]
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_INITIAL_ACCESS_TOKEN
          any: true
