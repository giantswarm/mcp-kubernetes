suite: PrometheusRule template tests
templates:
  - prometheusrule.yaml
tests:
  - it: should not render PrometheusRule when disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: should render PrometheusRule when enabled
    set:
      prometheusRules:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-kubernetes

  - it: should include standard labels
    set:
      prometheusRules:
        enabled: true
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: mcp-kubernetes
            app.kubernetes.io/instance: RELEASE-NAME

  # Mimir's rule_selector matches on the tenant label. Without it the
  # PrometheusRule is created and its alerts never evaluate, so the default
  # matters as much as the override.
  - it: should carry the giantswarm tenant label by default
    set:
      prometheusRules:
        enabled: true
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            observability.giantswarm.io/tenant: giantswarm

  - it: should keep the tenant default when an unrelated label is set
    set:
      prometheusRules:
        enabled: true
        labels:
          example.com/extra: value
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            observability.giantswarm.io/tenant: giantswarm
            example.com/extra: value

  - it: should let an explicit tenant label override the default
    set:
      prometheusRules:
        enabled: true
        labels:
          observability.giantswarm.io/tenant: customer
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            observability.giantswarm.io/tenant: customer

  - it: should drop the tenant label when set to null
    set:
      prometheusRules:
        enabled: true
        labels:
          observability.giantswarm.io/tenant: null
    asserts:
      - notExists:
          path: metadata.labels["observability.giantswarm.io/tenant"]

  - it: should include annotations when specified
    set:
      prometheusRules:
        enabled: true
        annotations:
          description: Test alerts
    asserts:
      - equal:
          path: metadata.annotations.description
          value: Test alerts

  - it: should contain mcp-kubernetes alert group
    set:
      prometheusRules:
        enabled: true
    asserts:
      - contains:
          path: spec.groups
          content:
            name: mcp-kubernetes
          any: true

  - it: should include team label in alerts
    set:
      prometheusRules:
        enabled: true
        team: planeteers
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].labels.team
          pattern: planeteers

  - it: should include inhibition labels in alerts
    set:
      prometheusRules:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].labels.cancel_if_cluster_control_plane_unhealthy
          value: "true"
      - equal:
          path: spec.groups[0].rules[0].labels.cancel_if_outside_working_hours
          value: "true"

  - it: should NOT contain oauth alert group when OAuth is disabled
    set:
      prometheusRules:
        enabled: true
      mcpKubernetes:
        oauth:
          enabled: false
    asserts:
      - notContains:
          path: spec.groups
          content:
            name: mcp-kubernetes.oauth
          any: true

  - it: should contain oauth alert group when OAuth is enabled
    set:
      prometheusRules:
        enabled: true
      mcpKubernetes:
        oauth:
          enabled: true
          baseURL: https://test.example.com
          dex:
            issuerURL: https://dex.example.com
            clientID: test-client
          existingSecret: test-secret
    asserts:
      - contains:
          path: spec.groups
          content:
            name: mcp-kubernetes.oauth
          any: true

  - it: should NOT contain federation alert group when CAPI mode is disabled
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: false
    asserts:
      - notContains:
          path: spec.groups
          content:
            name: mcp-kubernetes.federation
          any: true

  - it: should contain federation alert group when CAPI mode is enabled
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: true
    asserts:
      - contains:
          path: spec.groups
          content:
            name: mcp-kubernetes.federation
          any: true

  - it: should include custom runbook base URL in alert annotations
    set:
      prometheusRules:
        enabled: true
        runbookBaseUrl: https://runbooks.example.com
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.runbook_url
          pattern: '^https://runbooks.example.com/mcp-kubernetes-high-error-rate/\?INSTALLATION='

  # The Giant Swarm Alertmanager groups notifications by cluster_id and
  # installation, prints them as "Cluster: <installation> / <cluster_id>" and
  # matches every cancel_if_* inhibition on equal: [cluster_id]. An aggregation
  # that drops them ships an alert with an empty Cluster line that is never
  # inhibited — MCPKubernetesK8sOperationFailures did exactly that on
  # 2026-09-08. Every expression has to keep them.
  - it: should keep the cluster labels in every alert expression
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: true
      mcpKubernetes:
        oauth:
          enabled: true
          baseURL: https://test.example.com
          dex:
            issuerURL: https://dex.example.com
            clientID: test-client
          existingSecret: test-secret
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'sum by \(cluster_id, installation, pipeline, provider, namespace\) \(rate\(http_requests_total'
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'sum by \(cluster_id, installation, pipeline, provider, namespace, operation\) \(rate\(mcp_kubernetes_operations_total'
      - matchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: 'sum by \(cluster_id, installation, pipeline, provider, namespace\) \(rate\(oauth_downstream_auth_total'
      - matchRegex:
          path: spec.groups[2].rules[0].expr
          pattern: 'sum by \(cluster_id, installation, pipeline, provider, namespace, auth_mode\) \(rate\(mcp_kubernetes_wc_auth_total'
      - matchRegex:
          path: spec.groups[2].rules[1].expr
          pattern: 'sum by \(cluster_id, installation, pipeline, provider, namespace, operation\) \(rate\(mcp_kubernetes_operations_total'
      - notMatchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'sum\('
      - notMatchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'sum\('
      - notMatchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: 'sum\('
      - notMatchRegex:
          path: spec.groups[2].rules[0].expr
          pattern: 'sum\('
      - notMatchRegex:
          path: spec.groups[2].rules[1].expr
          pattern: 'sum\('

  - it: should name the installation and namespace in every description
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: true
      mcpKubernetes:
        oauth:
          enabled: true
          baseURL: https://test.example.com
          dex:
            issuerURL: https://dex.example.com
            clientID: test-client
          existingSecret: test-secret
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: 'in \{\{ \$labels\.namespace \}\} on \{\{ \$labels\.installation \}\}'
      - matchRegex:
          path: spec.groups[0].rules[1].annotations.description
          pattern: 'in \{\{ \$labels\.namespace \}\} on \{\{ \$labels\.installation \}\}'
      - matchRegex:
          path: spec.groups[1].rules[0].annotations.description
          pattern: 'in \{\{ \$labels\.namespace \}\} on \{\{ \$labels\.installation \}\}'
      - matchRegex:
          path: spec.groups[2].rules[0].annotations.description
          pattern: 'in \{\{ \$labels\.namespace \}\} on \{\{ \$labels\.installation \}\}'
      - matchRegex:
          path: spec.groups[2].rules[1].annotations.description
          pattern: 'in \{\{ \$labels\.namespace \}\} on \{\{ \$labels\.installation \}\}'

  # Runbooks live on the intranet and take INSTALLATION and CLUSTER as
  # variables; the alert fills them in from its own labels so the link opens
  # with the right kubectl context already set.
  - it: should link the intranet runbook with the alert's installation and cluster filled in
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/mcp-kubernetes-high-error-rate/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}'
      - equal:
          path: spec.groups[0].rules[1].annotations.runbook_url
          value: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/mcp-kubernetes-operation-failures/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}'
      - equal:
          path: spec.groups[1].rules[0].annotations.runbook_url
          value: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/mcp-kubernetes-auth-failures/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}#mcpkubernetesworkloadclusterauthfailures'
      - equal:
          path: spec.groups[1].rules[1].annotations.runbook_url
          value: 'https://intranet.giantswarm.io/docs/support-and-ops/runbooks/mcp-kubernetes-operation-failures/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}#mcpkubernetesclusteroperationfailures'

  - it: should not link a dashboard when the chart provisions none
    set:
      prometheusRules:
        enabled: true
    asserts:
      - notExists:
          path: spec.groups[0].rules[0].annotations.__dashboardUid__
      - notExists:
          path: spec.groups[0].rules[0].annotations.dashboardQueryParams

  # The Giant Swarm organization is orgId 2 in every installation's Grafana;
  # the platform's own alert links hardcode the same constant.
  - it: should link the administrator dashboard in the Giant Swarm organization
    set:
      prometheusRules:
        enabled: true
      grafanaDashboards:
        enabled: true
        giantswarm:
          enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].annotations.__dashboardUid__
          value: mcp-k8s-administrator
      - equal:
          path: spec.groups[0].rules[1].annotations.__dashboardUid__
          value: mcp-k8s-administrator
      - equal:
          path: spec.groups[0].rules[0].annotations.dashboardQueryParams
          value: 'orgId=2&var-namespace={{ $labels.namespace }}'

  - it: should link the cluster-operator dashboard for federation alerts and skip the orgId outside Giant Swarm
    set:
      prometheusRules:
        enabled: true
      capiMode:
        enabled: true
      grafanaDashboards:
        enabled: true
    asserts:
      - equal:
          path: spec.groups[1].rules[0].annotations.__dashboardUid__
          value: mcp-k8s-cluster-operator
      - equal:
          path: spec.groups[1].rules[1].annotations.__dashboardUid__
          value: mcp-k8s-cluster-operator
      - equal:
          path: spec.groups[1].rules[0].annotations.dashboardQueryParams
          value: 'var-namespace={{ $labels.namespace }}'
