# The install notes warn about in-memory OAuth token storage, and more loudly
# when more than one replica (the default) would split the tokens the server
# issues between pods.
suite: NOTES storage warning tests
templates:
  - templates/NOTES.txt
set:
  mcpKubernetes.oauth.enabled: true
  mcpKubernetes.oauth.baseURL: https://mcp.example.com
tests:
  - it: warns about in-memory token storage
    set:
      replicaCount: 1
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: OAuth tokens are stored in memory"
      - notMatchRegexRaw:
          pattern: "more than one replica"

  - it: warns about split tokens with the default two replicas
    asserts:
      - matchRegexRaw:
          pattern: "With more than one replica a token this server issues"

  - it: warns about split tokens with autoscaling
    set:
      replicaCount: 1
      autoscaling.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "With more than one replica a token this server issues"

  - it: stays quiet with Valkey storage
    set:
      mcpKubernetes.oauth.storage.type: valkey
      mcpKubernetes.oauth.storage.valkey.url: valkey.mcp-kubernetes.svc:6379
      replicaCount: 2
    asserts:
      - notMatchRegexRaw:
          pattern: "stored in memory"

  - it: says nothing about token storage without OAuth
    set:
      mcpKubernetes.oauth.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: "stored in memory"
