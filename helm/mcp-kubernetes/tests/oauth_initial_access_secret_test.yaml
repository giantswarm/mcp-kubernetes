suite: Initial access token secret precedence
templates:
  - templates/oauth-secret.yaml
set:
  mcpKubernetes.oauth.enabled: true
  mcpKubernetes.oauth.dex.clientSecret: provider-secret
tests:
  - it: renders the new token
    set:
      mcpKubernetes.oauth.initialAccessToken: current
    asserts:
      - equal:
          path: data.registration-token
          value: Y3VycmVudA==
  - it: renders the deprecated token
    set:
      mcpKubernetes.oauth.registrationAccessToken: legacy
    asserts:
      - equal:
          path: data.registration-token
          value: bGVnYWN5
  - it: gives the new token precedence
    set:
      mcpKubernetes.oauth.initialAccessToken: current
      mcpKubernetes.oauth.registrationAccessToken: legacy
    asserts:
      - equal:
          path: data.registration-token
          value: Y3VycmVudA==
