# OAuth credentials checksum tests for the mcp-kubernetes Helm chart
#
# The server reads its OAuth credentials (the client secret, the registration
# token, the token encryption key, the Valkey password) from a Secret at start
# and never again. The pod template's checksum/oauth-secret annotation restarts
# it when they change: the SHA-256 of the chart-rendered Secret's data, or
# mcpKubernetes.oauth.existingSecretChecksum verbatim for a Secret the chart
# does not render; checksum/valkey-secret carries the mark of a separate Valkey
# Secret. The pinned hashes are the SHA-256 of the Secret's data exactly as the
# chart renders it (key: base64 value per line, keys sorted); a change to that
# text rolls every installation on the next chart release.
#
# Run with: helm unittest ./helm/mcp-kubernetes

suite: OAuth credentials checksum
templates:
  - templates/deployment.yaml
  - templates/oauth-secret.yaml
release:
  name: mcp-kubernetes
  namespace: mcp-kubernetes
set:
  mcpKubernetes.oauth.baseURL: https://mcp.example.test
  mcpKubernetes.oauth.dex.issuerURL: https://dex.example.test
  mcpKubernetes.oauth.dex.clientID: mcp-kubernetes
tests:
  - it: renders no checksum annotations while OAuth is off
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]

  - it: hashes the data of the Secret it renders
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.dex.clientSecret: dex-secret-1
      mcpKubernetes.oauth.registrationAccessToken: reg-1
      mcpKubernetes.oauth.encryptionKey: true
      mcpKubernetes.oauth.encryptionKeyValue: key-1
      mcpKubernetes.oauth.storage.type: valkey
      mcpKubernetes.oauth.storage.valkey.url: valkey.mcp-kubernetes.svc:6379
      mcpKubernetes.oauth.storage.valkey.password: valkey-1
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: e9d5ee23ff6102bff5dc9df2f6d43a92aee7d61392ea255b918eca9ce7202c39
      - template: templates/deployment.yaml
        notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
      - template: templates/oauth-secret.yaml
        equal:
          path: data
          value:
            dex-client-secret: ZGV4LXNlY3JldC0x
            oauth-encryption-key: a2V5LTE=
            registration-token: cmVnLTE=
            valkey-password: dmFsa2V5LTE=
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mcp-kubernetes-oauth
                key: valkey-password
                optional: true

  - it: changes the checksum with a rotated credential
    template: templates/deployment.yaml
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.dex.clientSecret: dex-secret-2
      mcpKubernetes.oauth.registrationAccessToken: reg-1
      mcpKubernetes.oauth.encryptionKey: true
      mcpKubernetes.oauth.encryptionKeyValue: key-1
      mcpKubernetes.oauth.storage.type: valkey
      mcpKubernetes.oauth.storage.valkey.url: valkey.mcp-kubernetes.svc:6379
      mcpKubernetes.oauth.storage.valkey.password: valkey-1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 4d30fe2d3bb5bcc9080604fcad9ef3765593051e4e65c07fa7b5d13144a30f62

  - it: keeps podAnnotations and the scrape annotations beside the checksum
    template: templates/deployment.yaml
    set:
      podAnnotations:
        example.com/owner: bumblebee
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.dex.clientSecret: dex-secret-1
      mcpKubernetes.oauth.allowPublicRegistration: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: bumblebee
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: renders existingSecretChecksum verbatim for a Secret it does not render
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth-credentials
      mcpKubernetes.oauth.existingSecretChecksum: "2026-09-22T16:33:54Z"
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: "2026-09-22T16:33:54Z"
      - template: templates/oauth-secret.yaml
        hasDocuments:
          count: 0

  - it: renders no checksum for an existing Secret without a revision mark
    template: templates/deployment.yaml
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth-credentials
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]

  - it: takes the existing Secret and its mark from global.identity
    template: templates/deployment.yaml
    set:
      mcpKubernetes.oauth.enabled: true
      global.identity.existingSecret: agent-platform-idp
      mcpKubernetes.oauth.existingSecretChecksum: rev-3
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rev-3

  - it: marks a separate Valkey Secret with checksum/valkey-secret
    template: templates/deployment.yaml
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth-credentials
      mcpKubernetes.oauth.existingSecretChecksum: rev-3
      mcpKubernetes.oauth.storage.type: valkey
      mcpKubernetes.oauth.storage.valkey.url: valkey.mcp-kubernetes.svc:6379
      mcpKubernetes.oauth.storage.valkey.existingSecret: mcp-kubernetes-valkey
      mcpKubernetes.oauth.storage.valkey.existingSecretChecksum: "7"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rev-3
      - equal:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
          value: "7"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mcp-kubernetes-valkey
                key: valkey-password
                optional: true

  - it: renders no valkey mark while the password lives in the OAuth Secret
    template: templates/deployment.yaml
    set:
      mcpKubernetes.oauth.enabled: true
      mcpKubernetes.oauth.existingSecret: mcp-kubernetes-oauth-credentials
      mcpKubernetes.oauth.storage.type: valkey
      mcpKubernetes.oauth.storage.valkey.url: valkey.mcp-kubernetes.svc:6379
      mcpKubernetes.oauth.storage.valkey.existingSecretChecksum: "7"
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
