# Deployment template tests for mcp-kubernetes Helm chart
#
# These tests verify the Deployment configuration, particularly:
# - Projected ServiceAccount tokens (security best practice)
# - Container security context
# - Volume mounts
#
# Run with: helm unittest ./helm/mcp-kubernetes

suite: Deployment template tests
templates:
  - templates/deployment.yaml
tests:
  - it: should disable automountServiceAccountToken
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should mount projected ServiceAccount token volume
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sa-token
            projected:
              sources:
                - serviceAccountToken:
                    expirationSeconds: 3600
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace

  - it: should mount sa-token volume in container
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sa-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true

  - it: should set read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should drop all capabilities
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: should not allow privilege escalation
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should run as non-root
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true

  - it: should disable debug mode by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--debug=false"

  - it: should enable debug mode when configured
    set:
      mcpKubernetes:
        debug: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--debug=true"

  - it: should render the OTLP protocol and headers when set
    set:
      mcpKubernetes.instrumentation.tracingExporter: otlp
      mcpKubernetes.instrumentation.otlpEndpoint: otlp-gateway.kube-system.svc:4317
      mcpKubernetes.instrumentation.otlpProtocol: grpc
      mcpKubernetes.instrumentation.otlpHeaders: X-Scope-OrgID=giantswarm
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            value: X-Scope-OrgID=giantswarm

  - it: should render neither OTLP protocol nor headers by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
          any: true
