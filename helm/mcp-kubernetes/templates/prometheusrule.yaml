{{- if .Values.prometheusRules.enabled }}
{{- /*
Every aggregation below keeps the labels the Giant Swarm Alertmanager works
with; a plain sum() or sum by (operation) drops them and the notification
arrives with nothing to say:

  - cluster_id, installation: Alertmanager groups notifications by them, the
    Slack and PagerDuty templates print them ("Cluster: <installation> /
    <cluster_id>"), and every cancel_if_* inhibition matches on
    `equal: [cluster_id]` — an alert without cluster_id is never inhibited,
    not even by the alert whose cancel_if label it carries.
  - pipeline, provider: the routing tree selects PagerDuty routes by pipeline.
  - namespace: names the release when a cluster runs more than one.

The dimension an alert is about (operation, auth_mode) is added per rule.
Dashboard annotations follow the observability-operator convention:
__dashboardUid__ plus dashboardQueryParams become the notification's
Dashboard link. The Giant Swarm organization in every installation's Grafana
is orgId 2 (the same constant the platform's alert links use), which is what
the dashboards are provisioned into when grafanaDashboards.giantswarm is on.
*/}}
{{- $by := "cluster_id, installation, pipeline, provider, namespace" }}
{{- $runbook := printf "%s/%%s/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}%%s" .Values.prometheusRules.runbookBaseUrl }}
{{- $dashboardParams := "var-namespace={{ $labels.namespace }}" }}
{{- if .Values.grafanaDashboards.giantswarm.enabled }}
{{- $dashboardParams = printf "orgId=2&%s" $dashboardParams }}
{{- end }}
{{- $administratorDashboard := and .Values.grafanaDashboards.enabled .Values.grafanaDashboards.dashboards.administrator.enabled }}
{{- $clusterOperatorDashboard := and .Values.grafanaDashboards.enabled .Values.grafanaDashboards.dashboards.clusterOperator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "mcp-kubernetes.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-kubernetes.labels" . | nindent 4 }}
    {{- with .Values.prometheusRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRules.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    # Note: Generic alerts like "deployment not satisfied", "pod restarts", "high memory/CPU"
    # are already covered by centralized prometheus-rules in Giant Swarm clusters.
    # These alerts focus only on mcp-kubernetes-specific metrics.
    - name: mcp-kubernetes
      rules:
        {{- if .Values.prometheusRules.rules.mcpKubernetesHighErrorRate.enabled }}
        # Alert when MCP request error rate is high
        # This is specific to MCP protocol errors, not covered by generic HTTP monitoring
        - alert: MCPKubernetesHighErrorRate
          annotations:
            description: '{{`MCP Kubernetes in {{ $labels.namespace }} on {{ $labels.installation }} is answering {{ $value | humanizePercentage }} of MCP requests with HTTP 5xx.`}}'
            runbook_url: {{ printf $runbook "mcp-kubernetes-high-error-rate" "" | quote }}
            {{- if $administratorDashboard }}
            __dashboardUid__: mcp-k8s-administrator
            dashboardQueryParams: {{ $dashboardParams | quote }}
            {{- end }}
          expr: |
            (
              sum by ({{ $by }}) (rate(http_requests_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                status=~"5.."
              }[10m]))
              /
              sum by ({{ $by }}) (rate(http_requests_total{
                job="{{ include "mcp-kubernetes.fullname" . }}"
              }[10m]))
            ) > 0.1
          for: 15m
          labels:
            area: platform
            cancel_if_cluster_control_plane_unhealthy: "true"
            cancel_if_outside_working_hours: "true"
            severity: notify
            team: {{ .Values.prometheusRules.team }}
            topic: mcp
        {{- end }}

        {{- if .Values.prometheusRules.rules.mcpKubernetesK8sOperationFailures.enabled }}
        # Alert when Kubernetes operations performed by MCP are failing
        - alert: MCPKubernetesK8sOperationFailures
          annotations:
            description: '{{`MCP Kubernetes {{ $labels.operation }} operations against the management cluster are failing at {{ $value | humanizePercentage }} rate in {{ $labels.namespace }} on {{ $labels.installation }}.`}}'
            runbook_url: {{ printf $runbook "mcp-kubernetes-operation-failures" "" | quote }}
            {{- if $administratorDashboard }}
            __dashboardUid__: mcp-k8s-administrator
            dashboardQueryParams: {{ $dashboardParams | quote }}
            {{- end }}
          expr: |
            (
              sum by ({{ $by }}, operation) (rate(mcp_kubernetes_operations_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                cluster_scope="management",
                discovery_mode="single",
                status="error"
              }[15m]))
              /
              sum by ({{ $by }}, operation) (rate(mcp_kubernetes_operations_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                cluster_scope="management",
                discovery_mode="single"
              }[15m]))
            ) > 0.2
          for: 15m
          labels:
            area: platform
            cancel_if_cluster_control_plane_unhealthy: "true"
            cancel_if_outside_working_hours: "true"
            severity: notify
            team: {{ .Values.prometheusRules.team }}
            topic: mcp
        {{- end }}

    {{- if .Values.mcpKubernetes.oauth.enabled }}
    - name: mcp-kubernetes.oauth
      rules:
        {{- if .Values.prometheusRules.rules.mcpKubernetesOAuthFailures.enabled }}
        # Alert when mcp-kubernetes cannot act as the caller: the request passed
        # the OAuth middleware, but no per-user Kubernetes client came out of it.
        # Downstream OAuth always runs in strict mode (cmd/serve.go), which
        # records that as result="denied"; result="failure" is the non-strict
        # fallback path and the federation client provider's client-construction
        # error. result="fallback" is a request served by the service account
        # and not a failure the caller saw, so it is not counted.
        - alert: MCPKubernetesOAuthFailures
          annotations:
            description: '{{`MCP Kubernetes in {{ $labels.namespace }} on {{ $labels.installation }} could not act as the caller for {{ $value | humanizePercentage }} of authenticated requests (per-user Kubernetes client denied or failed).`}}'
            runbook_url: {{ printf $runbook "mcp-kubernetes-auth-failures" "" | quote }}
            {{- if $administratorDashboard }}
            __dashboardUid__: mcp-k8s-administrator
            dashboardQueryParams: {{ $dashboardParams | quote }}
            {{- end }}
          expr: |
            (
              sum by ({{ $by }}) (rate(oauth_downstream_auth_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                result=~"failure|denied"
              }[15m]))
              /
              sum by ({{ $by }}) (rate(oauth_downstream_auth_total{
                job="{{ include "mcp-kubernetes.fullname" . }}"
              }[15m]))
            ) > 0.3
          for: 15m
          labels:
            area: platform
            cancel_if_cluster_control_plane_unhealthy: "true"
            cancel_if_outside_working_hours: "true"
            severity: notify
            team: {{ .Values.prometheusRules.team }}
            topic: mcp
        {{- end }}
    {{- end }}

    {{- if .Values.capiMode.enabled }}
    - name: mcp-kubernetes.federation
      rules:
        {{- if .Values.prometheusRules.rules.mcpKubernetesWorkloadClusterAuthFailures.enabled }}
        # Alert when workload cluster authentication is consistently failing
        - alert: MCPKubernetesWorkloadClusterAuthFailures
          annotations:
            description: '{{`MCP Kubernetes in {{ $labels.namespace }} on {{ $labels.installation }} fails {{ $labels.auth_mode }} authentication to workload clusters at {{ $value | humanizePercentage }} rate.`}}'
            runbook_url: {{ printf $runbook "mcp-kubernetes-auth-failures" "#mcpkubernetesworkloadclusterauthfailures" | quote }}
            {{- if $clusterOperatorDashboard }}
            __dashboardUid__: mcp-k8s-cluster-operator
            dashboardQueryParams: {{ $dashboardParams | quote }}
            {{- end }}
          expr: |
            (
              sum by ({{ $by }}, auth_mode) (rate(mcp_kubernetes_wc_auth_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                result="error"
              }[15m]))
              /
              sum by ({{ $by }}, auth_mode) (rate(mcp_kubernetes_wc_auth_total{
                job="{{ include "mcp-kubernetes.fullname" . }}"
              }[15m]))
            ) > 0.3
          for: 15m
          labels:
            area: platform
            cancel_if_cluster_control_plane_unhealthy: "true"
            cancel_if_outside_working_hours: "true"
            severity: notify
            team: {{ .Values.prometheusRules.team }}
            topic: mcp
        {{- end }}

        {{- if .Values.prometheusRules.rules.mcpKubernetesClusterOperationFailures.enabled }}
        # Alert when cluster operations are consistently failing
        - alert: MCPKubernetesClusterOperationFailures
          annotations:
            description: '{{`MCP Kubernetes {{ $labels.operation }} operations against workload clusters are failing at {{ $value | humanizePercentage }} rate in {{ $labels.namespace }} on {{ $labels.installation }}.`}}'
            runbook_url: {{ printf $runbook "mcp-kubernetes-operation-failures" "#mcpkubernetesclusteroperationfailures" | quote }}
            {{- if $clusterOperatorDashboard }}
            __dashboardUid__: mcp-k8s-cluster-operator
            dashboardQueryParams: {{ $dashboardParams | quote }}
            {{- end }}
          expr: |
            (
              sum by ({{ $by }}, operation) (rate(mcp_kubernetes_operations_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                cluster_scope="workload",
                discovery_mode="capi",
                status="error"
              }[15m]))
              /
              sum by ({{ $by }}, operation) (rate(mcp_kubernetes_operations_total{
                job="{{ include "mcp-kubernetes.fullname" . }}",
                cluster_scope="workload",
                discovery_mode="capi"
              }[15m]))
            ) > 0.3
          for: 15m
          labels:
            area: platform
            cancel_if_cluster_control_plane_unhealthy: "true"
            cancel_if_outside_working_hours: "true"
            severity: notify
            team: {{ .Values.prometheusRules.team }}
            topic: mcp
        {{- end }}
    {{- end }}
{{- end }}
