{{- if and .Values.mcpKubernetes.oauth.enabled (not (include "mcp-kubernetes.oauth.existingSecret" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-kubernetes.fullname" . }}-oauth
  labels:
    {{- include "mcp-kubernetes.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "mcp-kubernetes.oauthSecretData" . | nindent 2 }}
{{- end }}
