{{- if and (not .Values.mcpKubernetes.oauth.enabled) (not .Values.mcpKubernetes.auth.existingSecret) }}
{{- $name := include "mcp-kubernetes.auth.secretName" . }}
{{- /* The generated token survives upgrades: an existing Secret keeps its value. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcp-kubernetes.labels" . | nindent 4 }}
type: Opaque
data:
  auth-token: {{ dig "data" "auth-token" (randAlphaNum 48 | b64enc) $existing | quote }}
{{- end }}
